name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -d site ]; then
            cp -a site/. _site/
          fi
          if [ ! -f _site/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset=utf-8><title>GameForge</title><p>site missing</p>' > _site/index.html
          fi
          if [ -f README.md ]; then
            cp README.md _site/README.md
          fi
          # health file for probes
          date -u +"%Y-%m-%dT%H:%M:%SZ" > _site/build.txt
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
